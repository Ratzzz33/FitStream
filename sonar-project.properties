# SonarQube Configuration for FitStream

sonar.projectKey=fitstream
sonar.projectName=FitStream
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/test/**,\
  **/__tests__/**,\
  android/**,\
  ios/**,\
  backend/node_modules/**,\
  devops/**

# TypeScript/JavaScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate
sonar.qualitygate.wait=true
