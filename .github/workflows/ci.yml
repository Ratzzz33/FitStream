# FitStream CI/CD Pipeline
# PR: lightweight (build + secrets only)
# Main: full security suite

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # BUILD & LINT - Always runs
  # ============================================
  build:
    name: 🔨 Build & Lint
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint || echo "ESLint warnings (non-blocking)"

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm run test:ci

      - name: Upload build
        uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: build-output-${{ github.run_id }}
          path: dist/
          retention-days: 3

  # ============================================
  # SECRETS SCAN - Always runs (fast)
  # ============================================
  secrets-scan:
    name: 🔐 Secrets Scan
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${PWD}:/src:Z" \
            docker.io/zricethezav/gitleaks:latest \
            detect --source=/src --no-git --exit-code=1 || true

  # ============================================
  # SECURITY SCANS - Only on main/develop
  # ============================================
  sast-semgrep:
    name: 🔍 SAST - Semgrep
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Semgrep
        run: |
          docker run --rm -v "${PWD}:/src:Z" \
            docker.io/returntocorp/semgrep:latest \
            semgrep scan --config auto --config p/react --json -o /src/semgrep.json /src || true

  sca-dependencies:
    name: 📦 SCA - Dependencies
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        run: npm audit --json > npm-audit.json 2>&1 || true

  container-scan:
    name: 🐳 Container Scan
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-output-${{ github.run_id }}
          path: dist/

      - name: Build & scan
        run: |
          docker build -t fitstream:${{ github.sha }} . || exit 0
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
            docker.io/aquasec/trivy:latest image --severity HIGH,CRITICAL \
            localhost/fitstream:${{ github.sha }} || true

  # ============================================
  # SECURITY REPORT - Only on main/develop
  # ============================================
  security-report:
    name: 📊 Security Report
    runs-on: self-hosted
    needs: [sast-semgrep, sca-dependencies, container-scan]
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Summary
        run: |
          echo "# 🛡️ Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
