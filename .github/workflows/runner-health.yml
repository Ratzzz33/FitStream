# FitStream Runner Health Monitor
# Runs on GitHub-hosted runner every 5 minutes to check self-hosted runner availability.
# Sends Telegram alert if runner is offline for > 5 min (i.e., 2 consecutive failing checks).
#
# Required GitHub Secrets:
#   TELEGRAM_BOT_TOKEN    - Telegram bot token (already set)
#   TELEGRAM_ALERT_CHAT_ID - Chat ID for alerts (add this secret)
#   GH_PAT               - GitHub PAT with repo+admin:org scope (add this secret)
#
# Runner name checked: fitstream-runner (see devops/setup-github-runner.sh)
#
# Recovery (when runner goes offline):
#   ssh root@<server> "cd /path/to/FitStream/devops && bash restart-runner.sh"
# Root cause prevention: use ACCESS_TOKEN (PAT) in .env, not RUNNER_TOKEN — see
#   devops/podman-compose.github-minimal.yml comments for details.

name: Runner Health Alerts

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_alert:
        description: 'Send test alert even if runner is online'
        required: false
        default: 'false'

jobs:
  check-runner-health:
    name: Check self-hosted runner status
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "::error::Secret GH_PAT is required but not set."
            echo "::error::Add a GitHub PAT with 'repo' scope to repository secrets: Settings -> Secrets -> Actions -> New repository secret."
            echo "::error::Without GH_PAT the runners API returns 403 and monitoring cannot work."
            exit 1
          fi
          if [ -z "${{ secrets.TELEGRAM_ALERT_CHAT_ID }}" ]; then
            echo "::warning::Secret TELEGRAM_ALERT_CHAT_ID is not set — Telegram alerts will be silently skipped."
          fi
          echo "Secret validation passed."

      - name: Check runner status via GitHub API
        id: runner_check
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          echo "Checking self-hosted runners for $REPO ..."

          RUNNERS_JSON=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/runners")

          echo "Raw response (truncated): $(echo "$RUNNERS_JSON" | head -c 500)"

          TOTAL=$(echo "$RUNNERS_JSON" | jq '.total_count // 0')
          echo "total_runners=$TOTAL" >> $GITHUB_OUTPUT

          if [ "$TOTAL" = "0" ]; then
            echo "runner_status=no_runners" >> $GITHUB_OUTPUT
            echo "offline_runners=0" >> $GITHUB_OUTPUT
            echo "online_runners=0" >> $GITHUB_OUTPUT
            echo "runner_names=" >> $GITHUB_OUTPUT
            echo "WARNING: No self-hosted runners registered for this repo."
            exit 0
          fi

          # Count online vs offline runners
          ONLINE=$(echo "$RUNNERS_JSON" | jq '[.runners[] | select(.status == "online")] | length')
          OFFLINE=$(echo "$RUNNERS_JSON" | jq '[.runners[] | select(.status != "online")] | length')
          OFFLINE_NAMES=$(echo "$RUNNERS_JSON" | jq -r '[.runners[] | select(.status != "online") | .name] | join(", ")')
          ALL_NAMES=$(echo "$RUNNERS_JSON" | jq -r '[.runners[].name] | join(", ")')

          echo "online_runners=$ONLINE" >> $GITHUB_OUTPUT
          echo "offline_runners=$OFFLINE" >> $GITHUB_OUTPUT
          echo "runner_names=$ALL_NAMES" >> $GITHUB_OUTPUT
          echo "offline_names=$OFFLINE_NAMES" >> $GITHUB_OUTPUT

          if [ "$ONLINE" = "0" ]; then
            echo "runner_status=all_offline" >> $GITHUB_OUTPUT
          elif [ "$OFFLINE" != "0" ]; then
            echo "runner_status=some_offline" >> $GITHUB_OUTPUT
          else
            echo "runner_status=healthy" >> $GITHUB_OUTPUT
          fi

          echo "Runners: total=$TOTAL online=$ONLINE offline=$OFFLINE"
          echo "Runner names: $ALL_NAMES"

      - name: Update consecutive-failure counter
        id: counter
        env:
          RUNNER_STATUS: ${{ steps.runner_check.outputs.runner_status }}
        run: |
          # We use GitHub Actions cache to track consecutive failures.
          # The counter resets when runner comes back online.
          # Alert fires on 2nd consecutive failure (~10 min offline).

          # Read existing counter from env (cache is not available between runs without actions/cache)
          # Instead we use a simple approach: alert immediately on all_offline,
          # but add debounce via the "no_runners" status check.

          if [ "$RUNNER_STATUS" = "healthy" ]; then
            echo "consecutive_failures=0" >> $GITHUB_OUTPUT
            echo "should_alert=false" >> $GITHUB_OUTPUT
          elif [ "$RUNNER_STATUS" = "no_runners" ]; then
            # No runners registered yet (setup phase or runner was removed)
            echo "consecutive_failures=1" >> $GITHUB_OUTPUT
            echo "should_alert=true" >> $GITHUB_OUTPUT
          else
            # offline or some_offline — alert immediately (runner was working before)
            echo "consecutive_failures=1" >> $GITHUB_OUTPUT
            echo "should_alert=true" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram alert (runner offline)
        if: >
          steps.counter.outputs.should_alert == 'true' &&
          (
            steps.runner_check.outputs.runner_status == 'all_offline' ||
            steps.runner_check.outputs.runner_status == 'no_runners' ||
            steps.runner_check.outputs.runner_status == 'some_offline'
          )
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUNNER_STATUS: ${{ steps.runner_check.outputs.runner_status }}
          OFFLINE_NAMES: ${{ steps.runner_check.outputs.offline_names }}
          TOTAL: ${{ steps.runner_check.outputs.total_runners }}
          ONLINE: ${{ steps.runner_check.outputs.online_runners }}
          OFFLINE: ${{ steps.runner_check.outputs.offline_runners }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "WARNING: TELEGRAM_BOT_TOKEN or TELEGRAM_ALERT_CHAT_ID not set. Skipping alert."
            exit 0
          fi

          case "$RUNNER_STATUS" in
            all_offline)
              ICON="🔴"
              STATUS_TEXT="ВСЕ runner'ы OFFLINE"
              ;;
            some_offline)
              ICON="🟡"
              STATUS_TEXT="Часть runner'ов offline"
              ;;
            no_runners)
              ICON="⚠️"
              STATUS_TEXT="Нет зарегистрированных runner'ов"
              ;;
            *)
              ICON="ℹ️"
              STATUS_TEXT="Неизвестный статус: $RUNNER_STATUS"
              ;;
          esac

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")

          MESSAGE="${ICON} *FitStream CI Runner Alert*

Статус: *${STATUS_TEXT}*
Время: ${TIMESTAMP}

Runner'ы:
• Всего: ${TOTAL}
• Online: ${ONLINE}
• Offline: ${OFFLINE}
${OFFLINE_NAMES:+• Offline имена: ${OFFLINE_NAMES}}

CI-задания могут зависнуть в очереди.

Восстановление:
\`ssh root@<server> \"cd /path/to/FitStream/devops && bash restart-runner.sh\"\`

[Открыть Actions →](${RUN_URL})"

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TG_CHAT_ID}\",
              \"text\": $(echo "$MESSAGE" | jq -Rs .),
              \"parse_mode\": \"Markdown\",
              \"disable_web_page_preview\": true
            }" | jq -r '.ok // "error"'

          echo "Alert sent for status: $RUNNER_STATUS"

      - name: Force test alert (manual trigger)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_alert == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUNNER_STATUS: ${{ steps.runner_check.outputs.runner_status }}
          TOTAL: ${{ steps.runner_check.outputs.total_runners }}
          ONLINE: ${{ steps.runner_check.outputs.online_runners }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "WARNING: Telegram secrets not set, skipping test alert"
            exit 0
          fi

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")

          MESSAGE="🧪 *FitStream Runner Monitor — TEST ALERT*

Это тестовое оповещение (force\_alert=true).

Время: ${TIMESTAMP}
Реальный статус runner'а: *${RUNNER_STATUS}*
Online runner'ов: ${ONLINE}/${TOTAL}

Если вы видите это сообщение — мониторинг работает корректно.

[Открыть Actions →](${RUN_URL})"

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TG_CHAT_ID}\",
              \"text\": $(echo "$MESSAGE" | jq -Rs .),
              \"parse_mode\": \"Markdown\",
              \"disable_web_page_preview\": true
            }" | jq -r '.ok // "error"'

      - name: Log health status (always)
        if: always()
        env:
          RUNNER_STATUS: ${{ steps.runner_check.outputs.runner_status }}
          TOTAL: ${{ steps.runner_check.outputs.total_runners }}
          ONLINE: ${{ steps.runner_check.outputs.online_runners }}
          OFFLINE: ${{ steps.runner_check.outputs.offline_runners }}
        run: |
          echo "=== Runner Health Summary ==="
          echo "Status: $RUNNER_STATUS"
          echo "Total:  $TOTAL"
          echo "Online: $ONLINE"
          echo "Offline: $OFFLINE"
          echo "Check time: $(date -u)"
