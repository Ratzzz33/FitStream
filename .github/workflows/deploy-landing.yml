# FitStream Landing Deploy to Hetzner VPS
# Deploys Next.js landing via Docker on fitstream.health

name: Deploy Landing

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fitstream-landing
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy Landing to Hetzner
    runs-on: self-hosted
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Check landing changes
        if: github.event_name == 'workflow_run'
        id: changes
        run: |
          CHANGED=$(gh api repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }} --jq '.files[].filename' | grep '^landing-next/' || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No landing changes, skipping deploy"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Landing changes detected: $CHANGED"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup SSH Key
        if: steps.changes.outputs.skip != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS
        if: steps.changes.outputs.skip != 'true'
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: root
        run: |
          echo "🚀 Deploying FitStream Landing..."

          ssh -i ~/.ssh/hetzner_key -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'DEPLOY_SCRIPT'
            set -e
            cd /opt/fitstream-landing

            echo "📥 Pulling latest changes..."
            git pull origin main

            echo "🔨 Building Docker image..."
            cd landing-next
            docker build -t fitstream-landing:latest .

            echo "🔄 Restarting container..."
            docker stop fitstream-landing 2>/dev/null || true
            docker rm fitstream-landing 2>/dev/null || true
            docker run -d --name fitstream-landing --restart unless-stopped -p 3004:3000 fitstream-landing:latest

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment complete!"
          DEPLOY_SCRIPT

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/hetzner_key

      - name: Health check
        if: steps.changes.outputs.skip != 'true'
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://fitstream.health)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP $STATUS)"
          else
            echo "❌ Health check failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Deployment summary
        if: steps.changes.outputs.skip != 'true'
        run: |
          echo "### 🚀 Landing Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Landing URL:** https://fitstream.health" >> $GITHUB_STEP_SUMMARY
          echo "**App URL:** https://app.fitstream.health" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
