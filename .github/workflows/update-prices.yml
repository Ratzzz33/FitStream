name: Update Product Prices

on:
  schedule:
    # Каждое воскресенье в 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      region:
        description: 'Region to update'
        required: true
        type: choice
        options:
          - all
          - russia
          - georgia
        default: 'all'

jobs:
  update-prices:
    name: Parse & Update Prices
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create parsers directory
        run: mkdir -p scripts/parsers

      - name: Parse VkusVill (Russia)
        if: ${{ github.event.inputs.region == 'all' || github.event.inputs.region == 'russia' || github.event_name == 'schedule' }}
        run: |
          echo "🇷🇺 Parsing VkusVill..."
          node scripts/parsers/vkusvill-parser.cjs || echo "VkusVill parsing failed, continuing..."
        continue-on-error: true

      - name: Parse Georgia
        if: ${{ github.event.inputs.region == 'all' || github.event.inputs.region == 'georgia' || github.event_name == 'schedule' }}
        run: |
          echo "🇬🇪 Parsing Georgia stores..."
          node scripts/parsers/georgia-parser.cjs || echo "Georgia parsing failed, continuing..."
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet services/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add services/russiaPricesService.ts services/georgiaProductsUpdated.ts 2>/dev/null || true

          CHANGES=$(git diff --cached --stat | tail -1)
          DATE=$(date +%Y-%m-%d)

          git commit -m "chore: Update product prices ($DATE)

          $CHANGES

          🤖 Auto-generated by price parser workflow" || echo "Nothing to commit"

          git push origin main

      - name: Summary
        run: |
          echo "## 📊 Price Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f services/russiaPricesService.ts ]; then
            COUNT=$(grep -c "id:" services/russiaPricesService.ts 2>/dev/null || echo "0")
            echo "🇷🇺 **Russia (VkusVill):** $COUNT products" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f services/georgiaProductsUpdated.ts ]; then
            COUNT=$(grep -c "id:" services/georgiaProductsUpdated.ts 2>/dev/null || echo "0")
            echo "🇬🇪 **Georgia:** $COUNT products" >> $GITHUB_STEP_SUMMARY
          fi
