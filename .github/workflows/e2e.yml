# FitStream E2E Tests - Playwright
# Runs on PR and push to main/develop

name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

# Cancel in-progress runs
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: 🎭 Playwright E2E
    runs-on: self-hosted
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Run on multiple browsers
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build application
        run: npm run build

      - name: Run E2E tests
        run: |
          npx playwright test \
            --project=${{ matrix.browser }} \
            --reporter=junit,html
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload traces on failure
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/**/*.zip
          retention-days: 7

  # Merge reports from all browsers
  merge-reports:
    name: 📊 Merge E2E Reports
    runs-on: self-hosted
    needs: e2e-tests
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all reports
        uses: actions/download-artifact@v7
        with:
          pattern: playwright-results-*
          path: all-reports/

      - name: Generate summary
        run: |
          echo "# 🎭 E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Browser | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY

          for browser in chromium firefox webkit; do
            if [ -d "all-reports/playwright-results-$browser" ]; then
              echo "| $browser | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $browser | ⚠️ No results |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Full reports available in artifacts" >> $GITHUB_STEP_SUMMARY

  # Mobile E2E tests (separate job)
  e2e-mobile:
    name: 📱 Mobile E2E
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Build application
        run: npm run build

      - name: Run Mobile E2E tests
        run: |
          npx playwright test \
            --project=mobile-chrome \
            --project=mobile-safari \
            --reporter=junit,html
        env:
          CI: true

      - name: Upload mobile test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-results-mobile
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Visual regression tests (optional)
  visual-regression:
    name: 👁️ Visual Regression
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Build application
        run: npm run build

      - name: Run visual tests
        run: |
          npx playwright test e2e/visual.spec.ts \
            --project=chromium \
            --update-snapshots || true
        env:
          CI: true

      - name: Upload visual diffs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: visual-regression-diffs
          path: test-results/**/*-diff.png
          retention-days: 7
