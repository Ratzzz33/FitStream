# FitStream E2E Tests
# PR: chromium only (fast)
# Main: all browsers

name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # E2E FOR PR - Chromium only (fast)
  # ============================================
  e2e-pr:
    name: 🎭 E2E (Chromium)
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test --project=chromium --reporter=html
        env:
          CI: true

      - name: Upload results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-results-pr
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ============================================
  # E2E FOR MAIN - All browsers (parallel)
  # ============================================
  e2e-chromium:
    name: 🎭 E2E (chromium)
    runs-on: self-hosted
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=chromium --reporter=html
        env:
          CI: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: results-chromium
          path: playwright-report/

  e2e-firefox:
    name: 🎭 E2E (firefox)
    runs-on: self-hosted
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps firefox
      - run: npm run build
      - run: npx playwright test --project=firefox --reporter=html
        env:
          CI: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: results-firefox
          path: playwright-report/

  e2e-webkit:
    name: 🎭 E2E (webkit)
    runs-on: self-hosted
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - run: npx playwright test --project=webkit --reporter=html
        env:
          CI: true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: results-webkit
          path: playwright-report/

  # ============================================
  # MOBILE - Only on main
  # ============================================
  e2e-mobile:
    name: 📱 Mobile E2E
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=mobile-chrome --reporter=html
        env:
          CI: true

  # ============================================
  # VISUAL - Only on PR
  # ============================================
  visual-regression:
    name: 👁️ Visual Regression
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install chromium
      - run: npm run build
      - run: npx playwright test e2e/visual.spec.ts --project=chromium || true
        env:
          CI: true
