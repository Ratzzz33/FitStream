name: 🤖 Android Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'landing/**'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: 🔧 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build web assets
        run: npm run build
        env:
          API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 📱 Sync Capacitor
        run: npx cap sync android

      - name: 🔨 Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🔨 Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: 📋 Get version
        id: version
        run: |
          VERSION=$(grep "APP_VERSION" version.ts | cut -d"'" -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fitstream-${{ steps.version.outputs.version }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fitstream-${{ steps.version.outputs.version }}-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: 📦 Copy APK for landing
        run: |
          mkdir -p landing-next/public/downloads
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk landing-next/public/downloads/fitstream-${{ steps.version.outputs.version }}.apk

      - name: 📤 Upload Landing APK
        uses: actions/upload-artifact@v4
        with:
          name: landing-apk
          path: landing-next/public/downloads/fitstream-*.apk

  update-landing:
    name: 📦 Update Landing with APK
    needs: build-android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download APK
        uses: actions/download-artifact@v4
        with:
          name: landing-apk
          path: landing-next/public/downloads/

      - name: 📋 Get version
        id: version
        run: |
          VERSION=$(grep "APP_VERSION" version.ts | cut -d"'" -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 📝 Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add landing-next/public/downloads/
          git diff --staged --quiet || git commit -m "chore: Update APK to v${{ steps.version.outputs.version }}"
          git push
