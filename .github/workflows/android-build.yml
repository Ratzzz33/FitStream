name: 🤖 Android Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'landing/**'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # Self-hosted runner has no pre-installed Android SDK (unlike GitHub-hosted
      # ubuntu-latest), so install it here and export ANDROID_HOME. Without this,
      # gradle fails with "SDK location not found".
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 🔧 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build web assets
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 📱 Sync Capacitor
        run: npx cap sync android

      - name: 🔨 Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🔨 Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: 📋 Get version
        id: version
        run: |
          VERSION=$(grep "APP_VERSION" version.ts | cut -d"'" -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: fitstream-${{ steps.version.outputs.version }}-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: fitstream-${{ steps.version.outputs.version }}-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: 📦 Copy APK for landing
        run: |
          mkdir -p landing-next/public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk landing-next/public/downloads/fitstream-${{ steps.version.outputs.version }}.apk

      - name: 📤 Upload Landing APK
        uses: actions/upload-artifact@v7
        with:
          name: landing-apk
          path: landing-next/public/downloads/fitstream-*.apk

  update-landing:
    name: 📦 Update Landing with APK
    needs: build-android
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📥 Download APK
        uses: actions/download-artifact@v8
        with:
          name: landing-apk
          path: /tmp/apk/

      - name: 📋 Get version
        id: version
        run: |
          VERSION=$(grep "APP_VERSION" version.ts | cut -d"'" -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🏷️ Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp /tmp/apk/fitstream-${{ steps.version.outputs.version }}.apk /tmp/apk/fitstream-latest.apk
          if gh release view v${{ steps.version.outputs.version }} &>/dev/null; then
            gh release upload v${{ steps.version.outputs.version }} \
              /tmp/apk/fitstream-latest.apk --clobber
          else
            gh release create v${{ steps.version.outputs.version }} \
              --title "FitStream v${{ steps.version.outputs.version }}" \
              --notes "Android APK auto-build" \
              /tmp/apk/fitstream-latest.apk
          fi
