# Build Android APK
# Builds debug APK using direct SDK installation

name: Build APK

on:
  push:
    branches: [main, feature/samsung-health-connect]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /opt/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  build-android:
    name: Build Android APK
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        run: |
          if ! command -v java &> /dev/null || ! java -version 2>&1 | grep -q "17"; then
            echo "Installing Java 17..."
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk
          fi
          java -version

      - name: Setup Android SDK
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "Installing Android SDK..."
            sudo mkdir -p $ANDROID_SDK_ROOT
            sudo chown -R $USER:$USER $ANDROID_SDK_ROOT

            # Download command line tools
            cd /tmp
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
            mv cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/

            # Install SDK components
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Clean Gradle cache
        run: |
          rm -rf ~/.gradle/caches/jars-* || true
          rm -rf android/.gradle || true

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          export GRADLE_USER_HOME=${{ github.workspace }}/.gradle
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=$JAVA_HOME --stacktrace

      - name: List APK output
        run: |
          find android -name "*.apk" -type f
          ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug APK not found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: FitStream-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Generate summary
        if: always()
        run: |
          echo "# Android Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            SIZE=$(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "## APK Ready" >> $GITHUB_STEP_SUMMARY
            echo "- **Size**: $SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact**: FitStream-debug-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Features" >> $GITHUB_STEP_SUMMARY
            echo "- Xiaomi Mi Scale BLE" >> $GITHUB_STEP_SUMMARY
            echo "- Samsung Health via Health Connect" >> $GITHUB_STEP_SUMMARY
            echo "- Weight, Steps, Heart Rate sync" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "APK was not generated. Check logs for errors." >> $GITHUB_STEP_SUMMARY
          fi
