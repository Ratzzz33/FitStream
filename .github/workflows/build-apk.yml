# Build Android APK
# Builds debug and release APK artifacts

name: Build APK

on:
  push:
    branches: [main, feature/samsung-health-connect]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: fitstream-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: fitstream-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Generate summary
        run: |
          echo "# Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## APK Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APK**: fitstream-debug-apk" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK**: fitstream-release-apk (unsigned)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Features" >> $GITHUB_STEP_SUMMARY
          echo "- Xiaomi Mi Scale BLE integration" >> $GITHUB_STEP_SUMMARY
          echo "- Health Connect (Samsung Health, Google Fit sync)" >> $GITHUB_STEP_SUMMARY
          echo "- Weight, Steps, Heart Rate, Exercise tracking" >> $GITHUB_STEP_SUMMARY
