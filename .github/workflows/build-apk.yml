# Build Android APK
# Builds debug and release APK artifacts using Docker

name: Build APK

on:
  push:
    branches: [main, feature/samsung-health-connect]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build-android:
    name: Build Android APK
    runs-on: self-hosted
    timeout-minutes: 45
    container:
      image: docker.io/cimg/android:2024.01.1-node
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Copy APKs to workspace
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/FitStream-debug.apk || true
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/FitStream-release.apk || true
          ls -la apk-output/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: FitStream-debug-apk
          path: apk-output/FitStream-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: FitStream-release-apk
          path: apk-output/FitStream-release.apk
          retention-days: 30

      - name: Generate summary
        run: |
          echo "# Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Download APK" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to **Actions** tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Click on this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "3. Scroll to **Artifacts** section" >> $GITHUB_STEP_SUMMARY
          echo "4. Download **FitStream-debug-apk**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Features Included" >> $GITHUB_STEP_SUMMARY
          echo "- Xiaomi Mi Scale BLE integration" >> $GITHUB_STEP_SUMMARY
          echo "- Health Connect (Samsung Health sync)" >> $GITHUB_STEP_SUMMARY
          echo "- Weight, Steps, Heart Rate, Exercise tracking" >> $GITHUB_STEP_SUMMARY
          echo "- Body composition analysis" >> $GITHUB_STEP_SUMMARY
