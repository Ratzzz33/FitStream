<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Скалолаз - упор лёжа с коленом к груди -->
  <!-- Голова -->
  <circle cx="10" cy="20" r="5" class="head"/>
  <!-- Туловище под углом -->
  <line x1="15" y1="22" x2="38" y2="34" class="stick"/>
  <!-- Руки прямые вниз -->
  <line x1="18" y1="23" x2="16" y2="50" class="stick"/>
  <!-- Колено подтянуто к груди -->
  <line x1="38" y1="34" x2="28" y2="38" class="stick"/>
  <line x1="28" y1="38" x2="26" y2="50" class="stick"/>
  <!-- Задняя нога вытянута -->
  <line x1="38" y1="34" x2="54" y2="40" class="stick"/>
  <line x1="54" y1="40" x2="56" y2="50" class="stick"/>
  <!-- Пол -->
  <line x1="4" y1="52" x2="60" y2="52" stroke="#666" stroke-width="2"/>
</svg>
