<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .body-part { fill: #FFFFFF; }
    .left-leg {
      transform-origin: 40px 34px;
      animation: climb-left 0.5s ease-in-out infinite;
    }
    .right-leg {
      transform-origin: 40px 34px;
      animation: climb-right 0.5s ease-in-out infinite;
    }
    @keyframes climb-left {
      0%, 100% { transform: translateX(-20px) rotate(-30deg); }
      50% { transform: translateX(0) rotate(0deg); }
    }
    @keyframes climb-right {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      50% { transform: translateX(-20px) rotate(-30deg); }
    }
  </style>
  <rect x="4" y="52" width="56" height="2" fill="#666"/>
  <circle cx="10" cy="28" r="5" class="body-part"/>
  <rect x="12" y="26" width="28" height="6" rx="3" class="body-part"/>
  <rect x="14" y="32" width="4" height="20" rx="2" class="body-part"/>
  <rect x="24" y="32" width="4" height="20" rx="2" class="body-part"/>
  <rect x="40" y="28" width="16" height="4" rx="2" class="body-part left-leg"/>
  <rect x="40" y="32" width="16" height="4" rx="2" class="body-part right-leg"/>
</svg>