<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .body-part { fill: #FFFFFF; }
    .upper-body {
      animation: dip 1s ease-in-out infinite;
    }
    .arms {
      transform-origin: 32px 26px;
      animation: arm-bend 1s ease-in-out infinite;
    }
    @keyframes dip {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }
    @keyframes arm-bend {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(25deg); }
    }
  </style>
  <!-- Bench/Chair -->
  <rect x="4" y="28" width="56" height="4" fill="#666"/>
  <rect x="8" y="32" width="4" height="26" fill="#666"/>
  <rect x="52" y="32" width="4" height="26" fill="#666"/>
  <!-- Floor -->
  <rect x="4" y="56" width="56" height="2" fill="#666"/>
  <g class="upper-body">
    <!-- Head -->
    <circle cx="32" cy="14" r="5" class="body-part"/>
    <!-- Torso -->
    <rect x="28" y="20" width="8" height="14" rx="3" class="body-part"/>
  </g>
  <!-- Arms on bench -->
  <g class="arms">
    <rect x="18" y="24" width="10" height="4" rx="2" class="body-part"/>
    <rect x="36" y="24" width="10" height="4" rx="2" class="body-part"/>
  </g>
  <!-- Legs extended -->
  <rect x="28" y="34" width="5" height="18" rx="2" class="body-part" transform="rotate(20 30 34)"/>
  <rect x="31" y="34" width="5" height="18" rx="2" class="body-part" transform="rotate(20 33 34)"/>
</svg>
