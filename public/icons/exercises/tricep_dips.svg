<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Обратные отжимания - руки на скамье сзади -->
  <!-- Скамья/опора -->
  <line x1="4" y1="24" x2="56" y2="24" stroke="#666" stroke-width="3"/>
  <line x1="8" y1="24" x2="8" y2="54" stroke="#666" stroke-width="2"/>
  <line x1="52" y1="24" x2="52" y2="54" stroke="#666" stroke-width="2"/>
  <!-- Голова -->
  <circle cx="32" cy="14" r="5" class="head"/>
  <!-- Туловище вертикально -->
  <line x1="32" y1="19" x2="32" y2="36" class="stick"/>
  <!-- Руки согнуты на опоре -->
  <line x1="32" y1="22" x2="24" y2="22" class="stick"/>
  <line x1="24" y1="22" x2="22" y2="24" class="stick"/>
  <line x1="32" y1="22" x2="40" y2="22" class="stick"/>
  <line x1="40" y1="22" x2="42" y2="24" class="stick"/>
  <!-- Ноги вытянуты вперёд -->
  <line x1="32" y1="36" x2="48" y2="44" class="stick"/>
  <line x1="48" y1="44" x2="54" y2="52" class="stick"/>
  <!-- Пол -->
  <line x1="4" y1="54" x2="60" y2="54" stroke="#666" stroke-width="2"/>
</svg>
