<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Отжимание - нижняя позиция, боковой вид -->
  <!-- Голова -->
  <circle cx="10" cy="24" r="5" class="head"/>
  <!-- Туловище горизонтально -->
  <line x1="15" y1="26" x2="40" y2="32" class="stick"/>
  <!-- Рука согнута -->
  <line x1="18" y1="27" x2="16" y2="38" class="stick"/>
  <line x1="16" y1="38" x2="16" y2="50" class="stick"/>
  <!-- Ноги прямые назад -->
  <line x1="40" y1="32" x2="54" y2="36" class="stick"/>
  <line x1="54" y1="36" x2="56" y2="50" class="stick"/>
  <!-- Пол -->
  <line x1="4" y1="52" x2="60" y2="52" stroke="#666" stroke-width="2"/>
</svg>
