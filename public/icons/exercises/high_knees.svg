<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Высокие колени - бег на месте -->
  <!-- Голова -->
  <circle cx="32" cy="8" r="5" class="head"/>
  <!-- Туловище -->
  <line x1="32" y1="13" x2="32" y2="30" class="stick"/>
  <!-- Руки согнуты в беге -->
  <line x1="32" y1="18" x2="24" y2="22" class="stick"/>
  <line x1="24" y1="22" x2="22" y2="16" class="stick"/>
  <line x1="32" y1="18" x2="40" y2="24" class="stick"/>
  <line x1="40" y1="24" x2="44" y2="20" class="stick"/>
  <!-- Левая нога поднята высоко -->
  <line x1="32" y1="30" x2="24" y2="34" class="stick"/>
  <line x1="24" y1="34" x2="22" y2="44" class="stick"/>
  <!-- Правая нога стоит -->
  <line x1="32" y1="30" x2="38" y2="42" class="stick"/>
  <line x1="38" y1="42" x2="40" y2="54" class="stick"/>
</svg>
