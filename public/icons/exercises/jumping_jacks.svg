<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Джампинг джек - ноги и руки в стороны -->
  <!-- Голова -->
  <circle cx="32" cy="8" r="5" class="head"/>
  <!-- Туловище -->
  <line x1="32" y1="13" x2="32" y2="30" class="stick"/>
  <!-- Руки подняты в стороны вверх -->
  <line x1="32" y1="18" x2="18" y2="8" class="stick"/>
  <line x1="32" y1="18" x2="46" y2="8" class="stick"/>
  <!-- Ноги широко в стороны -->
  <line x1="32" y1="30" x2="18" y2="54" class="stick"/>
  <line x1="32" y1="30" x2="46" y2="54" class="stick"/>
</svg>
