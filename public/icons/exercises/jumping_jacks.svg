<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .body-part { fill: #FFFFFF; }
    .left-arm {
      transform-origin: 28px 20px;
      animation: arm-left 0.6s ease-in-out infinite;
    }
    .right-arm {
      transform-origin: 36px 20px;
      animation: arm-right 0.6s ease-in-out infinite;
    }
    .left-leg {
      transform-origin: 28px 38px;
      animation: leg-left 0.6s ease-in-out infinite;
    }
    .right-leg {
      transform-origin: 36px 38px;
      animation: leg-right 0.6s ease-in-out infinite;
    }
    @keyframes arm-left {
      0%, 100% { transform: rotate(-60deg); }
      50% { transform: rotate(0deg); }
    }
    @keyframes arm-right {
      0%, 100% { transform: rotate(60deg); }
      50% { transform: rotate(0deg); }
    }
    @keyframes leg-left {
      0%, 100% { transform: rotate(-20deg); }
      50% { transform: rotate(0deg); }
    }
    @keyframes leg-right {
      0%, 100% { transform: rotate(20deg); }
      50% { transform: rotate(0deg); }
    }
  </style>
  <circle cx="32" cy="10" r="6" class="body-part"/>
  <rect x="28" y="17" width="8" height="16" rx="3" class="body-part"/>
  <rect x="26" y="18" width="4" height="14" rx="2" class="body-part left-arm"/>
  <rect x="34" y="18" width="4" height="14" rx="2" class="body-part right-arm"/>
  <rect x="26" y="34" width="5" height="20" rx="2" class="body-part left-leg"/>
  <rect x="33" y="34" width="5" height="20" rx="2" class="body-part right-leg"/>
</svg>