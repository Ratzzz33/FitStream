<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Пресс/скручивание - боковой вид, верхняя позиция -->
  <!-- Голова поднята -->
  <circle cx="18" cy="18" r="5" class="head"/>
  <!-- Туловище под углом 45° к полу -->
  <line x1="21" y1="22" x2="34" y2="40" class="stick"/>
  <!-- Руки за головой -->
  <line x1="18" y1="20" x2="12" y2="16" class="stick"/>
  <line x1="12" y1="16" x2="16" y2="12" class="stick"/>
  <!-- Бедро согнуто -->
  <line x1="34" y1="40" x2="48" y2="34" class="stick"/>
  <!-- Голень вниз, стопы на полу -->
  <line x1="48" y1="34" x2="50" y2="50" class="stick"/>
  <!-- Пол -->
  <line x1="4" y1="52" x2="60" y2="52" stroke="#666" stroke-width="2"/>
</svg>
