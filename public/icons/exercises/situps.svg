<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .body-part { fill: #FFFFFF; }
    .upper {
      transform-origin: 32px 40px;
      animation: situp 1.2s ease-in-out infinite;
    }
    @keyframes situp {
      0%, 100% { transform: rotate(-60deg); }
      50% { transform: rotate(-10deg); }
    }
  </style>
  <rect x="4" y="54" width="56" height="2" fill="#666"/>
  <!-- Legs bent -->
  <rect x="44" y="44" width="5" height="12" rx="2" class="body-part" transform="rotate(-30 46 50)"/>
  <rect x="50" y="48" width="5" height="10" rx="2" class="body-part"/>
  <!-- Upper body -->
  <g class="upper">
    <circle cx="20" cy="32" r="5" class="body-part"/>
    <rect x="22" y="30" width="18" height="6" rx="3" class="body-part"/>
    <rect x="16" y="28" width="8" height="3" rx="1.5" class="body-part"/>
  </g>
  <!-- Hip anchor -->
  <rect x="38" y="42" width="8" height="8" rx="3" class="body-part"/>
</svg>