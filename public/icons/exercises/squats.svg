<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Присед - боковой вид -->
  <!-- Голова -->
  <circle cx="24" cy="16" r="6" class="head"/>
  <!-- Туловище (наклон вперёд) -->
  <line x1="24" y1="22" x2="32" y2="36" class="stick"/>
  <!-- Руки вытянуты вперёд -->
  <line x1="26" y1="26" x2="16" y2="24" class="stick"/>
  <line x1="16" y1="24" x2="8" y2="22" class="stick"/>
  <!-- Бедро (горизонтально) -->
  <line x1="32" y1="36" x2="46" y2="38" class="stick"/>
  <!-- Голень (вертикально вниз) -->
  <line x1="46" y1="38" x2="44" y2="54" class="stick"/>
  <!-- Стопа -->
  <line x1="44" y1="54" x2="50" y2="54" class="stick"/>
</svg>
