<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Подъём на носки - стоя, на цыпочках -->
  <!-- Голова -->
  <circle cx="32" cy="6" r="5" class="head"/>
  <!-- Туловище вертикально -->
  <line x1="32" y1="11" x2="32" y2="28" class="stick"/>
  <!-- Руки на поясе -->
  <line x1="32" y1="18" x2="24" y2="22" class="stick"/>
  <line x1="32" y1="18" x2="40" y2="22" class="stick"/>
  <!-- Ноги прямые -->
  <line x1="32" y1="28" x2="28" y2="44" class="stick"/>
  <line x1="28" y1="44" x2="28" y2="50" class="stick"/>
  <line x1="32" y1="28" x2="36" y2="44" class="stick"/>
  <line x1="36" y1="44" x2="36" y2="50" class="stick"/>
  <!-- На носках (пятки подняты) -->
  <line x1="26" y1="50" x2="30" y2="50" class="stick"/>
  <line x1="34" y1="50" x2="38" y2="50" class="stick"/>
  <!-- Пол ниже (в воздухе на носках) -->
  <line x1="8" y1="56" x2="56" y2="56" stroke="#666" stroke-width="2"/>
</svg>
