<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .body-part { fill: #FFFFFF; }
    .body {
      animation: raise 0.8s ease-in-out infinite;
    }
    .heels {
      animation: heel-lift 0.8s ease-in-out infinite;
    }
    @keyframes raise {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes heel-lift {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.3); }
    }
  </style>
  <rect x="4" y="56" width="56" height="2" fill="#666"/>
  <g class="body">
    <!-- Head -->
    <circle cx="32" cy="8" r="5" class="body-part"/>
    <!-- Torso -->
    <rect x="28" y="14" width="8" height="16" rx="3" class="body-part"/>
    <!-- Arms at sides -->
    <rect x="22" y="16" width="5" height="12" rx="2" class="body-part"/>
    <rect x="37" y="16" width="5" height="12" rx="2" class="body-part"/>
    <!-- Upper legs -->
    <rect x="27" y="30" width="4" height="14" rx="2" class="body-part"/>
    <rect x="33" y="30" width="4" height="14" rx="2" class="body-part"/>
    <!-- Lower legs -->
    <rect x="27" y="44" width="4" height="10" rx="2" class="body-part"/>
    <rect x="33" y="44" width="4" height="10" rx="2" class="body-part"/>
  </g>
  <!-- Heels (animate separately) -->
  <g class="heels" style="transform-origin: 32px 56px;">
    <rect x="26" y="54" width="5" height="2" rx="1" class="body-part"/>
    <rect x="33" y="54" width="5" height="2" rx="1" class="body-part"/>
  </g>
</svg>
