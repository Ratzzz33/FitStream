<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Бёрпи - прыжок вверх с руками -->
  <!-- Голова -->
  <circle cx="32" cy="6" r="5" class="head"/>
  <!-- Туловище -->
  <line x1="32" y1="11" x2="32" y2="28" class="stick"/>
  <!-- Руки вверх -->
  <line x1="32" y1="16" x2="22" y2="6" class="stick"/>
  <line x1="32" y1="16" x2="42" y2="6" class="stick"/>
  <!-- Ноги слегка согнуты -->
  <line x1="32" y1="28" x2="26" y2="40" class="stick"/>
  <line x1="26" y1="40" x2="24" y2="52" class="stick"/>
  <line x1="32" y1="28" x2="38" y2="40" class="stick"/>
  <line x1="38" y1="40" x2="40" y2="52" class="stick"/>
  <!-- Пол пунктиром (в воздухе) -->
  <line x1="8" y1="58" x2="56" y2="58" stroke="#666" stroke-width="2" stroke-dasharray="4,2"/>
</svg>
