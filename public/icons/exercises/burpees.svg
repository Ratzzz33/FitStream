<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .body-part { fill: #FFFFFF; }
    .jumper {
      animation: burpee-jump 1s ease-in-out infinite;
    }
    .arms-up {
      transform-origin: 32px 18px;
      animation: arms-raise 1s ease-in-out infinite;
    }
    @keyframes burpee-jump {
      0%, 100% { transform: translateY(0) scaleY(1); }
      25% { transform: translateY(10px) scaleY(0.8); }
      50% { transform: translateY(-8px) scaleY(1.05); }
      75% { transform: translateY(0) scaleY(1); }
    }
    @keyframes arms-raise {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(30deg); }
      50% { transform: rotate(-10deg); }
      75% { transform: rotate(0deg); }
    }
  </style>
  <g class="jumper">
    <circle cx="32" cy="12" r="6" class="body-part"/>
    <rect x="28" y="19" width="8" height="14" rx="3" class="body-part"/>
    <rect x="27" y="34" width="5" height="18" rx="2" class="body-part"/>
    <rect x="32" y="34" width="5" height="18" rx="2" class="body-part"/>
  </g>
  <g class="arms-up">
    <rect x="18" y="14" width="12" height="4" rx="2" class="body-part"/>
    <rect x="34" y="14" width="12" height="4" rx="2" class="body-part"/>
  </g>
</svg>