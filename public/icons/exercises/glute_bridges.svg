<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Ягодичный мост - таз поднят -->
  <!-- Голова на полу -->
  <circle cx="8" cy="44" r="5" class="head"/>
  <!-- Плечи на полу, таз поднят -->
  <line x1="13" y1="44" x2="22" y2="44" class="stick"/>
  <line x1="22" y1="44" x2="36" y2="28" class="stick"/>
  <!-- Бедро вниз к колену -->
  <line x1="36" y1="28" x2="48" y2="36" class="stick"/>
  <!-- Голень вниз к полу -->
  <line x1="48" y1="36" x2="50" y2="50" class="stick"/>
  <!-- Руки вдоль тела на полу -->
  <line x1="10" y1="42" x2="6" y2="38" class="stick"/>
  <!-- Пол -->
  <line x1="4" y1="52" x2="60" y2="52" stroke="#666" stroke-width="2"/>
</svg>
