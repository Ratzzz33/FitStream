<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .body-part { fill: #FFFFFF; }
    .hips {
      transform-origin: 32px 44px;
      animation: bridge 1.2s ease-in-out infinite;
    }
    @keyframes bridge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
  <rect x="4" y="54" width="56" height="2" fill="#666"/>
  <!-- Head on ground -->
  <circle cx="10" cy="48" r="5" class="body-part"/>
  <!-- Feet planted -->
  <rect x="48" y="50" width="6" height="4" rx="2" class="body-part"/>
  <!-- Bent legs -->
  <rect x="42" y="42" width="5" height="14" rx="2" class="body-part" transform="rotate(20 44 49)"/>
  <!-- Hips lifting -->
  <g class="hips">
    <rect x="14" y="42" width="30" height="6" rx="3" class="body-part"/>
  </g>
</svg>
