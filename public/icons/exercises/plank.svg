<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Планка - боковой вид на локтях -->
  <!-- Голова -->
  <circle cx="10" cy="22" r="5" class="head"/>
  <!-- Туловище прямое под углом -->
  <line x1="15" y1="24" x2="44" y2="32" class="stick"/>
  <!-- Рука на локте -->
  <line x1="18" y1="25" x2="14" y2="36" class="stick"/>
  <line x1="14" y1="36" x2="14" y2="50" class="stick"/>
  <!-- Ноги прямые -->
  <line x1="44" y1="32" x2="56" y2="36" class="stick"/>
  <line x1="56" y1="36" x2="56" y2="50" class="stick"/>
  <!-- Пол -->
  <line x1="4" y1="52" x2="60" y2="52" stroke="#666" stroke-width="2"/>
</svg>
