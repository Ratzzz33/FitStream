<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .body-part { fill: #FFFFFF; }
    .core {
      animation: plank-hold 2s ease-in-out infinite;
    }
    @keyframes plank-hold {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
  </style>
  <rect x="4" y="52" width="56" height="2" fill="#666"/>
  <circle cx="10" cy="30" r="5" class="body-part core"/>
  <rect x="12" y="28" width="36" height="6" rx="3" class="body-part core"/>
  <rect x="48" y="30" width="10" height="4" rx="2" class="body-part"/>
  <rect x="16" y="34" width="4" height="18" rx="2" class="body-part"/>
  <rect x="30" y="34" width="4" height="18" rx="2" class="body-part"/>
</svg>