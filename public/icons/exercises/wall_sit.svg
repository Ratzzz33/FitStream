<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Стульчик у стены - спина прижата, бёдра параллельно полу -->
  <!-- Стена -->
  <line x1="8" y1="4" x2="8" y2="56" stroke="#666" stroke-width="3"/>
  <!-- Голова у стены -->
  <circle cx="16" cy="12" r="5" class="head"/>
  <!-- Спина вдоль стены -->
  <line x1="14" y1="17" x2="14" y2="32" class="stick"/>
  <!-- Руки вдоль туловища -->
  <line x1="14" y1="22" x2="20" y2="28" class="stick"/>
  <!-- Бёдра горизонтально (90°) -->
  <line x1="14" y1="32" x2="32" y2="32" class="stick"/>
  <!-- Голени вертикально вниз -->
  <line x1="32" y1="32" x2="32" y2="52" class="stick"/>
  <!-- Стопы -->
  <line x1="32" y1="52" x2="38" y2="52" class="stick"/>
  <!-- Пол -->
  <line x1="4" y1="54" x2="60" y2="54" stroke="#666" stroke-width="2"/>
</svg>
