<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Боковой выпад - фронтальный вид -->
  <!-- Голова -->
  <circle cx="24" cy="8" r="5" class="head"/>
  <!-- Туловище наклонено в сторону -->
  <line x1="24" y1="13" x2="24" y2="28" class="stick"/>
  <!-- Руки вытянуты для баланса -->
  <line x1="24" y1="18" x2="12" y2="16" class="stick"/>
  <line x1="24" y1="18" x2="36" y2="20" class="stick"/>
  <!-- Согнутая нога (в сторону выпада) -->
  <line x1="24" y1="28" x2="12" y2="40" class="stick"/>
  <line x1="12" y1="40" x2="10" y2="54" class="stick"/>
  <!-- Прямая нога (вытянута в другую сторону) -->
  <line x1="24" y1="28" x2="48" y2="36" class="stick"/>
  <line x1="48" y1="36" x2="54" y2="54" class="stick"/>
</svg>
