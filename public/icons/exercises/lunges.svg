<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: #FFFFFF; }
  </style>
  <!-- Выпад - боковой вид -->
  <!-- Голова -->
  <circle cx="32" cy="8" r="5" class="head"/>
  <!-- Туловище вертикально -->
  <line x1="32" y1="13" x2="32" y2="28" class="stick"/>
  <!-- Руки на поясе -->
  <line x1="32" y1="18" x2="26" y2="22" class="stick"/>
  <line x1="32" y1="18" x2="38" y2="22" class="stick"/>
  <!-- Передняя нога согнута 90° -->
  <line x1="32" y1="28" x2="20" y2="40" class="stick"/>
  <line x1="20" y1="40" x2="18" y2="54" class="stick"/>
  <!-- Задняя нога вытянута назад -->
  <line x1="32" y1="28" x2="46" y2="38" class="stick"/>
  <line x1="46" y1="38" x2="52" y2="54" class="stick"/>
</svg>
