version: "3.8"

# FitStream DevSecOps Stack - MINIMAL VERSION
# Для серверов с ограниченными ресурсами (4GB RAM)
# Использование: podman-compose -f podman-compose.minimal.yml up -d

services:
  # ============================================
  # GITEA - Git Server + CI/CD
  # ============================================
  gitea:
    image: docker.io/gitea/gitea:1.22-rootless
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__ROOT_URL=http://localhost:3000
      - GITEA__actions__ENABLED=true
      - GITEA__actions__DEFAULT_ACTIONS_URL=github
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    ports:
      - "3000:3000"
      - "2222:2222"
    networks:
      - devops-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================
  # GITEA RUNNER
  # ============================================
  gitea-runner:
    image: docker.io/gitea/act_runner:latest
    container_name: gitea-runner
    restart: unless-stopped
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_TOKEN:-}
      - GITEA_RUNNER_NAME=fitstream-runner
    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      - gitea-runner-data:/data
    depends_on:
      - gitea
    networks:
      - devops-net
    deploy:
      resources:
        limits:
          memory: 1G

  # ============================================
  # TRIVY - SCA & Container Scanner (lightweight)
  # ============================================
  trivy:
    image: docker.io/aquasec/trivy:latest
    container_name: trivy
    restart: unless-stopped
    command: ["server", "--listen", "0.0.0.0:4954"]
    volumes:
      - trivy-cache:/root/.cache
    ports:
      - "4954:4954"
    networks:
      - devops-net
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  devops-net:
    driver: bridge

volumes:
  gitea-data:
  gitea-config:
  gitea-runner-data:
  trivy-cache:
