version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitstream}
      POSTGRES_DB: ${POSTGRES_DB:-fitstream}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitstream}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fitstream}:${POSTGRES_PASSWORD:-fitstream}@postgres:5432/${POSTGRES_DB:-fitstream}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  foodscan:
    build:
      context: .
      dockerfile: apps/foodscan/Dockerfile
    restart: unless-stopped
    ports:
      - "5001:5173"
    environment:
      - VITE_API_URL=http://backend:3001/api
      - VITE_APP_NAME=FoodScan

  smartcart:
    build:
      context: .
      dockerfile: apps/smartcart/Dockerfile
    restart: unless-stopped
    ports:
      - "5002:5173"
    environment:
      - VITE_API_URL=http://backend:3001/api
      - VITE_APP_NAME=SmartCart

  cookbot:
    build:
      context: .
      dockerfile: apps/cookbot/Dockerfile
    restart: unless-stopped
    ports:
      - "5003:5173"
    environment:
      - VITE_API_URL=http://backend:3001/api
      - VITE_APP_NAME=CookBot

  fridgetracker:
    build:
      context: .
      dockerfile: apps/fridgetracker/Dockerfile
    restart: unless-stopped
    ports:
      - "5004:5173"
    environment:
      - VITE_API_URL=http://backend:3001/api
      - VITE_APP_NAME=FridgeTracker

  aicoach:
    build:
      context: .
      dockerfile: apps/aicoach/Dockerfile
    restart: unless-stopped
    ports:
      - "5005:5173"
    environment:
      - VITE_API_URL=http://backend:3001/api
      - VITE_APP_NAME=AICoach

  menuscan:
    build:
      context: .
      dockerfile: apps/menuscan/Dockerfile
    restart: unless-stopped
    ports:
      - "5006:5173"
    environment:
      - VITE_API_URL=http://backend:3001/api
      - VITE_APP_NAME=MenuScan

volumes:
  pgdata:
